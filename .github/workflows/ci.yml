name: CI

on:
  push:
  pull_request:

jobs:
  typescript:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  program:
    name: Program build, tests and end-to-end
    runs-on: ubuntu-latest
    env:
      ANCHOR_VERSION: 1.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --force
          avm install "$ANCHOR_VERSION"
          avm use "$ANCHOR_VERSION"
      - run: solana-keygen new --no-bip39-passphrase -s -o ~/.config/solana/id.json
      - run: anchor build
      - name: Program tests (LiteSVM)
        run: cargo test
      - run: pnpm install --frozen-lockfile
      - name: SDK and MCP end-to-end tests (local validator)
        run: pnpm test:e2e
      - name: Browser tests (local validator)
        run: |
          pnpm --filter @agent-escrow/web exec playwright install --with-deps chromium
          pnpm test:browser
