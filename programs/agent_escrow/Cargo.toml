[package]
name = "agent_escrow"
version = "0.1.0"
description = "USDC job escrow for agents: payment releases when the committed acceptance test passes"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "agent_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"

[dev-dependencies]
litesvm = "0.16.0"
litesvm-token = "0.16.0"
solana-transaction = "4.1"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-clock = "3.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
